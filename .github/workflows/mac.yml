name: Mac build

# Mac release build of Dewitt and Airliner: universal (Apple Silicon + Intel) VST3, AU and CLAP, checked,
# signed, AU-validated, with installers (tools/build-mac.sh does the work).
#   - push to main, or by hand (Actions > Mac build > Run workflow): the files come back as the "Mac-release"
#     download on the run's page
#   - Run workflow with label empty: the release build (Dewitt_v<version>_Mac.zip), also put in a DRAFT release
#   - push a tag like mac-v1.0-test1: the same as a push, plus a DRAFT pre-release on the Releases page
# Secrets are never given to pull requests from forks (this workflow doesn't run on pull requests at all).
# Signing and notarizing switch on by themselves once these repository secrets exist (Settings > Secrets and
# variables > Actions), all from the Apple Developer account:
#   MAC_APP_P12_BASE64        the "Developer ID Application" certificate + key as a .p12, base64-encoded
#   MAC_INSTALLER_P12_BASE64  the "Developer ID Installer" certificate + key as a .p12, base64-encoded
#   MAC_P12_PASSWORD          the password of both .p12 files
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   (an app-specific password from account.apple.com)
# (the same names as Mercy's repo; the identities' names are read from the certificates)
on:
  push:
    branches: [main]
    tags: ['mac-v*']
  workflow_dispatch:
    inputs:
      label:
        description: 'Text after the version in file names (empty for a final release)'
        default: ''
        required: false
      airliner_all:
        description: 'Also build Airliner Looper and Airliner Vinyl'
        type: boolean
        default: false

permissions:
  contents: write     # only used to make the draft release from a mac-v* tag

jobs:
  mac:
    # Apple Silicon only: the AU's Info.plist is made by running the arm64 build, which an Intel Mac can't do.
    # When GitHub's Apple Silicon queue is full the job gives up after 15 minutes without starting: rerun it.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Signing certificates (when the secrets are set)
        env:
          APP_P12: ${{ secrets.MAC_APP_P12_BASE64 }}
          INST_P12: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_P12_PASSWORD }}
        run: |
          if [ -z "$APP_P12" ]; then echo "no signing secrets: building ad-hoc signed test files"; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"; KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          if [ -n "$INST_P12" ]; then
            echo "$INST_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          fi
          rm -f "$RUNNER_TEMP"/*.p12
          # Apple's Developer ID G2 intermediate, so the chain is complete on any runner image
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC" || echo "(couldn't fetch the G2 intermediate; using the system's)"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KC"
          # the identities' full names, e.g. "Developer ID Application: NAME (TEAMID)"
          APP=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          INST=$(security find-identity -v "$KC" | grep -o '"Developer ID Installer: [^"]*"' | head -1 | tr -d '"')
          [ -n "$APP" ] && [ -n "$INST" ] || { echo "need both the Developer ID Application and Developer ID Installer certificates"; exit 1; }
          echo "MAC_SIGN_APP=$APP" >> "$GITHUB_ENV"
          echo "MAC_SIGN_INSTALLER=$INST" >> "$GITHUB_ENV"

      - name: Build, check, sign and package
        env:
          # pushes are test builds ("beta"); Run workflow uses the label as typed, and empty means a release
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          LABEL_IN: ${{ inputs.label }}
          AIRLINER_ALL: ${{ inputs.airliner_all && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'YCD5K76V6N' }}   # slapworx's Team ID (public: it's in every signed file)
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ "$IS_DISPATCH" = true ]; then export LABEL="$LABEL_IN"; else export LABEL=beta; fi
          tools/build-mac.sh

      - name: Mac-release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mac-release
          path: dist/release/
          if-no-files-found: ignore
          retention-days: 30
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: dist/logs/
          retention-days: 14

      - name: Draft pre-release (mac-v* tags only)
        if: startsWith(github.ref, 'refs/tags/mac-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* --draft --prerelease \
            --title "Mac $GITHUB_REF_NAME" \
            --notes "Mac test build of Dewitt and Airliner: universal (Apple Silicon + Intel), VST3, AU and CLAP, macOS 10.15+. Checks and signing details are in the run's logs."

      - name: Draft release with the Dewitt download (Run workflow only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a DRAFT: only the repo owner can see it, so the public repo doesn't hand out the download
          gh release create "dewitt-build-${{ github.run_number }}" dist/release/Dewitt_*_Mac.zip --draft \
            --title "Dewitt Mac download (build ${{ github.run_number }})" --notes "Made by run ${{ github.run_id }}."
